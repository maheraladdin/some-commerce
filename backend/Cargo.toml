[workspace]
members = [
    ".",
    "crates/kernel-core",
    "crates/db-schema",
    "crates/cache-tier",
    "bins/storefront-sdui-api",
    "bins/checkout-webhooks-api",
    "bins/admin-vendor-api",
    "bins/fulfillment-worker",
    "bins/durable-orchestrator",
]
default-members = ["bins/storefront-sdui-api"]
resolver = "2"

[package]
name = "some-commerce-backend"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
kernel-core = { workspace = true }
db-schema = { workspace = true }
cache-tier = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
bytes = { workspace = true }

[workspace.package]
version = "1.0.0"
edition = "2024"
authors = ["some-commerce Team"]
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.43", features = ["full"] }
axum = { version = "0.8", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
async-trait = "0.1"
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.28", features = ["tokio-comp", "connection-manager"] }
blake3 = "1.5"
bytes = "1.10"
uuid = { version = "1.13", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
lambda_http = "0.14"
lambda_runtime = "0.14"

# Internal workspace crates
kernel-core = { path = "crates/kernel-core" }
db-schema = { path = "crates/db-schema" }
cache-tier = { path = "crates/cache-tier" }
